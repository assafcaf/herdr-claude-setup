<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="How a task tab grows: one pane, then two rows, then the lower row halved, then a two-by-two grid. Each spawn splits the largest pane along its longer axis.">
  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="#11161d" stroke="#30363d"/>
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>
  <g xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="32" y="34" font-size="13" fill="#e6edf3" font-weight="600">tab <tspan fill="#58a6ff">review-KAN-32</tspan></text>
    <text x="196" y="34" font-size="12" fill="#8b949e">one tab per task, one pane per agent, laid out as a grid</text>

    <g font-size="10.5">
      <rect x="32.5" y="56.5" width="190" height="130" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="40.5" y="64.5" width="174" height="114" rx="4" fill="#161b22" stroke="#3fb950"/>
      <text x="52" y="86" fill="#e6edf3">alpha</text>
      <text x="32" y="206" fill="#8b949e">1st spawn creates the tab,</text>
      <text x="32" y="221" fill="#8b949e">labelled with the task slug</text>

      <rect x="246.5" y="56.5" width="190" height="130" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="254.5" y="64.5" width="174" height="53" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="266" y="86" fill="#8b949e">alpha</text>
      <rect x="254.5" y="125.5" width="174" height="53" rx="4" fill="#161b22" stroke="#3fb950"/>
      <text x="266" y="147" fill="#e6edf3">bravo</text>
      <text x="246" y="206" fill="#8b949e">2nd: the largest pane is</text>
      <text x="246" y="221" fill="#8b949e">taller than wide, so split down</text>

      <rect x="460.5" y="56.5" width="190" height="130" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="468.5" y="64.5" width="174" height="53" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="480" y="86" fill="#8b949e">alpha</text>
      <rect x="468.5" y="125.5" width="84" height="53" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="480" y="147" fill="#8b949e">bravo</text>
      <rect x="558.5" y="125.5" width="84" height="53" rx="4" fill="#161b22" stroke="#3fb950"/>
      <text x="570" y="147" fill="#e6edf3">charlie</text>
      <text x="460" y="206" fill="#8b949e">3rd: that half is wider than</text>
      <text x="460" y="221" fill="#8b949e">tall now, so it splits right</text>

      <rect x="674.5" y="56.5" width="190" height="130" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="682.5" y="64.5" width="84" height="53" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="694" y="86" fill="#8b949e">alpha</text>
      <rect x="772.5" y="64.5" width="84" height="53" rx="4" fill="#161b22" stroke="#3fb950"/>
      <text x="784" y="86" fill="#e6edf3">delta</text>
      <rect x="682.5" y="125.5" width="84" height="53" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="694" y="147" fill="#8b949e">bravo</text>
      <rect x="772.5" y="125.5" width="84" height="53" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="784" y="147" fill="#8b949e">charlie</text>
      <text x="674" y="206" fill="#8b949e">4th: alpha is largest again,</text>
      <text x="674" y="221" fill="#8b949e">and the tab is a 2x2 grid</text>
    </g>

    <g stroke="#484f58" fill="none" marker-end="url(#t)">
      <path d="M226 121 L242 121"/>
      <path d="M440 121 L456 121"/>
      <path d="M654 121 L670 121"/>
    </g>

    <rect x="32.5" y="238.5" width="836" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="46" y="257" font-size="11" fill="#8b949e">Always the <tspan fill="#e6edf3">largest</tspan> pane, halved along its longer axis. Terminal cells are about twice as tall as they are wide, so</text>
    <text x="46" y="273" font-size="11" fill="#8b949e">"wider than tall" is <tspan fill="#e6edf3">width &gt; 2 x height</tspan>; under 100 columns it stacks instead of splitting something too narrow to read.</text>
  </g>
</svg>
