<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="Left: the Agent tool runs subagents in-process, where Herdr cannot see them. Right: herdr-spawn puts each agent in a real pane, where it can be watched, prompted and interrupted.">
  <rect x="0.5" y="0.5" width="899" height="423" rx="12" fill="#11161d" stroke="#30363d"/>
  <g xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- headers -->
    <text x="32" y="34" font-size="13" fill="#f85149" font-weight="600">Agent tool</text>
    <text x="112" y="34" font-size="13" fill="#8b949e">subagent runs in-process</text>
    <text x="478" y="34" font-size="13" fill="#3fb950" font-weight="600">herdr-spawn.sh</text>
    <text x="592" y="34" font-size="13" fill="#8b949e">agent runs in a pane</text>
    <line x1="454" y1="20" x2="454" y2="404" stroke="#30363d" stroke-dasharray="3 5"/>

    <!-- LEFT: one session, ghosts inside -->
    <rect x="32.5" y="52.5" width="390" height="140" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="72" font-size="11" fill="#8b949e">pane w1:p1 — one claude process, yours</text>
    <g font-size="11">
      <rect x="46.5" y="82.5" width="361" height="30" rx="5" fill="#0d1117" stroke="#484f58" stroke-dasharray="4 3"/>
      <text x="58" y="101" fill="#6e7681">subagent  general-purpose      no pty · no pid · no id</text>
      <rect x="46.5" y="117.5" width="361" height="30" rx="5" fill="#0d1117" stroke="#484f58" stroke-dasharray="4 3"/>
      <text x="58" y="136" fill="#6e7681">subagent  Plan                 no pty · no pid · no id</text>
      <rect x="46.5" y="152.5" width="361" height="30" rx="5" fill="#0d1117" stroke="#484f58" stroke-dasharray="4 3"/>
      <text x="58" y="171" fill="#6e7681">subagent  claude               no pty · no pid · no id</text>
    </g>

    <rect x="32.5" y="208.5" width="390" height="72" rx="6" fill="#0d1117" stroke="#30363d"/>
    <g font-size="11.5">
      <text x="46" y="230"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">herdr agent list</tspan></text>
      <text x="46" y="250" fill="#8b949e">1 agent   claude   w1:p1   idle</text>
      <text x="46" y="270" fill="#f85149">the three above are not in that list, and never will be</text>
    </g>

    <g font-size="12" fill="#8b949e">
      <text x="32" y="308"><tspan fill="#f85149">✗</tspan>  occupies no pane, so there is nothing to look at</text>
      <text x="32" y="332"><tspan fill="#f85149">✗</tspan>  has no name, so nothing can address it</text>
      <text x="32" y="356"><tspan fill="#f85149">✗</tspan>  cannot be read, prompted or interrupted</text>
      <text x="32" y="380"><tspan fill="#f85149">✗</tspan>  reports only when it is already finished</text>
    </g>

    <!-- RIGHT: a tab of panes -->
    <rect x="478.5" y="52.5" width="390" height="24" rx="6" fill="#0d1117" stroke="#30363d"/>
    <circle cx="492" cy="64" r="3.5" fill="#58a6ff"/>
    <text x="504" y="68" font-size="11" fill="#e6edf3">tab  review-KAN-32</text>
    <text x="700" y="68" font-size="11" fill="#8b949e">one tab per task</text>

    <g font-size="11.5">
      <rect x="478.5" y="86.5" width="189" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
      <circle cx="492" cy="104" r="4" fill="#3fb950"/>
      <text x="504" y="108" fill="#e6edf3">reviewer</text>
      <text x="492" y="124" font-size="10" fill="#6e7681">working · w7:p1</text>

      <rect x="679.5" y="86.5" width="189" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
      <circle cx="693" cy="104" r="4" fill="#3fb950"/>
      <text x="705" y="108" fill="#e6edf3">tester</text>
      <text x="693" y="124" font-size="10" fill="#6e7681">working · w7:p2</text>

      <rect x="478.5" y="140.5" width="189" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
      <circle cx="492" cy="158" r="4" fill="#d29922"/>
      <text x="504" y="162" fill="#e6edf3">docs</text>
      <text x="492" y="178" font-size="10" fill="#6e7681">blocked · w7:p3</text>

      <rect x="679.5" y="140.5" width="189" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
      <circle cx="693" cy="158" r="4" fill="#8b949e"/>
      <text x="705" y="162" fill="#e6edf3">bench</text>
      <text x="693" y="178" font-size="10" fill="#6e7681">idle · w7:p4</text>
    </g>

    <rect x="478.5" y="208.5" width="390" height="72" rx="6" fill="#0d1117" stroke="#30363d"/>
    <g font-size="11.5">
      <text x="492" y="230"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">herdr agent list</tspan></text>
      <text x="492" y="250" fill="#8b949e">4 agents  reviewer  tester  docs  bench</text>
      <text x="492" y="270"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">herdr agent read reviewer --lines 120</tspan></text>
    </g>

    <g font-size="12" fill="#8b949e">
      <text x="478" y="308"><tspan fill="#3fb950">✓</tspan>  a real pane you can watch mid-turn</text>
      <text x="478" y="332"><tspan fill="#3fb950">✓</tspan>  a name: SendMessage({to: "reviewer"})</text>
      <text x="478" y="356"><tspan fill="#3fb950">✓</tspan>  read, prompt, interrupt from the TUI</text>
      <text x="478" y="380"><tspan fill="#3fb950">✓</tspan>  close the tab and the team is gone</text>
    </g>
  </g>
</svg>
