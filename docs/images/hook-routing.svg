<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" role="img" aria-label="The PreToolUse Agent hook: read-only subagent types stay in-process, everything else is refused and pointed at the spawner. Outside Herdr the hook stands down.">
  <rect x="0.5" y="0.5" width="899" height="355" rx="12" fill="#11161d" stroke="#30363d"/>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>
  <g xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="32" y="34" font-size="13" fill="#e6edf3" font-weight="600">PreToolUse(Agent)</text>
    <text x="180" y="34" font-size="12" fill="#8b949e">capability decides, because parallelism is not observable from one hook call</text>

    <rect x="32.5" y="122.5" width="188" height="72" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="46" y="146" font-size="11.5" fill="#e6edf3">Agent({</text>
    <text x="46" y="164" font-size="11.5" fill="#e6edf3">  subagent_type: ...</text>
    <text x="46" y="182" font-size="11.5" fill="#e6edf3">})</text>

    <path d="M222 158 L246 158" stroke="#484f58" fill="none" marker-end="url(#h)"/>

    <rect x="248.5" y="112.5" width="180" height="92" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="262" y="136" font-size="11.5" fill="#58a6ff">route-agent-</text>
    <text x="262" y="153" font-size="11.5" fill="#58a6ff">to-herdr.sh</text>
    <text x="262" y="178" font-size="10" fill="#8b949e">can this one write,</text>
    <text x="262" y="192" font-size="10" fill="#8b949e">or run long?</text>

    <g stroke="#484f58" fill="none" marker-end="url(#h)">
      <path d="M430 140 L450 140 L450 104 L466 104"/>
      <path d="M430 176 L450 176 L450 232 L466 232"/>
    </g>

    <g font-size="11">
      <rect x="468.5" y="56.5" width="176" height="96" rx="6" fill="#0d1117" stroke="#3fb950"/>
      <text x="482" y="78" fill="#3fb950">no — read-only</text>
      <text x="482" y="98" fill="#8b949e">Explore</text>
      <text x="482" y="114" fill="#8b949e">claude-code-guide</text>
      <text x="482" y="130" fill="#8b949e">statusline-setup</text>
      <text x="482" y="146" fill="#8b949e">evidence-reviewer</text>

      <rect x="468.5" y="184.5" width="176" height="96" rx="6" fill="#0d1117" stroke="#f85149"/>
      <text x="482" y="206" fill="#f85149">yes, or unknown</text>
      <text x="482" y="226" fill="#8b949e">general-purpose</text>
      <text x="482" y="242" fill="#8b949e">Plan</text>
      <text x="482" y="258" fill="#8b949e">claude</text>
      <text x="482" y="274" fill="#8b949e">anything unlisted</text>
    </g>

    <g stroke="#484f58" fill="none" marker-end="url(#h)">
      <path d="M646 104 L670 104"/>
      <path d="M646 232 L670 232"/>
    </g>

    <g font-size="11">
      <rect x="672.5" y="74.5" width="194" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="686" y="96" fill="#3fb950">exit 0</text>
      <text x="686" y="116" fill="#e6edf3">runs in-process</text>

      <rect x="672.5" y="196.5" width="194" height="72" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="686" y="218" fill="#f85149">exit 2</text>
      <text x="686" y="238" fill="#e6edf3">refused, and handed</text>
      <text x="686" y="254" fill="#e6edf3">the spawn command</text>
    </g>

    <rect x="32.5" y="298.5" width="836" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="46" y="323" font-size="11" fill="#8b949e">Outside Herdr (<tspan fill="#e6edf3">HERDR_ENV != 1</tspan>), or with <tspan fill="#e6edf3">CC_ALLOW_INPROCESS_AGENTS=1</tspan>, the hook exits at once and the Agent tool behaves normally.</text>
  </g>
</svg>
